services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-join}
      POSTGRES_USER: ${POSTGRES_USER:-join}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-join}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/lordvaster/join-corp-api:latest
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-join}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-join}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/lordvaster/join-corp-web:latest
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.join.co.id}
    restart: unless-stopped
    environment:
      # Dipakai kode sisi-server (Server Component, Route Handler) agar
      # memanggil FastAPI langsung lewat jaringan Docker, tidak lewat
      # Cloudflare — lebih cepat dan tetap jalan walau Tunnel/DNS belum aktif.
      INTERNAL_API_URL: http://api:8000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - web
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    profiles: ["prod"]

volumes:
  db_data:
